{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Không có quyền truy cập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { f88: '#16a34a', f88dark: '#0b6b2f' } } } }
    </script>
    <style>
      #mynavbar { display: none !important; }
      .footer { display: none !important; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-emerald-50 via-white to-white flex items-center justify-center px-4">
  <div class="bg-white shadow-xl shadow-emerald-100/60 border border-gray-100 rounded-2xl p-8 max-w-lg w-full text-center">
    <div class="flex justify-center mb-4">
      <a href="{% url 'home' %}"><img src="https://f88.vn/images/root/logo-f88-primary.svg" alt="F88" class="h-12"></a>
    </div>
    <h1 class="text-2xl font-semibold text-red-600 mb-2">403 - Không có quyền truy cập</h1>
    <p class="text-gray-700 mb-4">Bạn không có quyền truy cập trang này.</p>
    {% if messages %}
      <div class="space-y-2 mb-4">
        {% for message in messages %}
          <div class="rounded-lg border border-amber-200 bg-amber-50 text-amber-700 px-4 py-2 text-sm">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    <div class="flex flex-col sm:flex-row sm:justify-center gap-3">
      <a href="{% url 'home' %}" class="inline-flex justify-center items-center rounded-lg bg-f88 hover:bg-f88dark text-white font-semibold px-4 py-2.5 transition">Về trang chủ</a>
    </div>
  </div>
</body>
</html>
