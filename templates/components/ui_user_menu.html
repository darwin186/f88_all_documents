<div class="relative text-[9px] text-gray-700" data-user-menu>
      <button type="button" class="inline-flex items-center gap-2 rounded-lg border border-gray-200 px-3 py-2 hover:bg-gray-50" data-user-toggle aria-expanded="false">
        <div class="hidden sm:flex flex-col leading-tight text-right">
          <span class="font-semibold text-gray-900 text-[9px]">
            {% if request.user.last_name or request.user.first_name %}
              {{ request.user.last_name }} {{ request.user.first_name }}
            {% else %}
              {{ request.user.username }}
            {% endif %}
          </span>
          <span class="text-[9px] text-gray-500">
            {% if is_super_admin %}Super Admin{% elif is_admin %}Admin{% elif is_checker %}Checker{% elif is_supervisor %}Supervisor{% elif is_risk %}Risk{% elif is_shop_user %}Shop{% else %}User{% endif %}
            • {{ request.user.username }}
          </span>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      <div class="absolute right-0 mt-2 w-40 rounded-xl border border-gray-200 bg-white shadow-lg py-1 hidden" data-user-dropdown>
        <a href="{% url 'user_profile_v2' %}" class="flex items-center gap-2 px-3 py-2 text-[9px] text-gray-700 hover:bg-gray-50">
          Thông tin cá nhân
        </a>
        {% if 'ctv_accounts' in allowed_screens %}
        <a href="{% url 'ctv_account_management_v2' %}" class="flex items-center gap-2 px-3 py-2 text-[9px] text-gray-700 hover:bg-gray-50">
          Quản lý tài khoản CTV
        </a>
        {% endif %}
        {% if is_admin or is_super_admin %}
        <a href="/admin/" class="flex items-center gap-2 px-3 py-2 text-[9px] text-gray-700 hover:bg-gray-50">
          Admin portal
        </a>
        {% endif %}
        <form action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button type="submit" class="w-full text-left flex items-center gap-2 px-3 py-2 text-[9px] text-gray-700 hover:bg-gray-50">
            Đăng xuất
          </button>
        </form>
      </div>
    </div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const menu = document.querySelector('[data-user-menu]');
    if (!menu) return;
    const toggle = menu.querySelector('[data-user-toggle]');
    const dropdown = menu.querySelector('[data-user-dropdown]');
    if (!toggle || !dropdown) return;

    const closeMenu = () => {
      dropdown.classList.add('hidden');
      toggle.setAttribute('aria-expanded', 'false');
    };

    toggle.addEventListener('click', (event) => {
      event.stopPropagation();
      const isHidden = dropdown.classList.contains('hidden');
      dropdown.classList.toggle('hidden', !isHidden);
      toggle.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
    });

    document.addEventListener('click', (event) => {
      if (!menu.contains(event.target)) {
        closeMenu();
      }
    });
  });
</script>
