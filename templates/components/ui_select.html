{# UI Kit — Select. Xem docs/ui-kit/components/select.md. #}
{# Dùng: {% include 'components/ui_select.html' with field=field %}  (tuỳ chọn: search=on|off|auto  clear=on|off|auto  max=3  summary=chips|count  size=sm  placeholder="..."  limit=300) #}
<div class="ui-select{% if size == 'sm' %} ui-select-sm{% endif %}" data-ui-select{% if search %} data-search="{{ search }}"{% endif %}{% if clear %} data-clear="{{ clear }}"{% endif %}{% if max %} data-max="{{ max }}"{% endif %}{% if summary %} data-summary="{{ summary }}"{% endif %}{% if placeholder %} data-placeholder="{{ placeholder }}"{% endif %}{% if limit %} data-limit="{{ limit }}"{% endif %}{% if field.errors %} data-invalid{% endif %}>{{ field }}</div>
