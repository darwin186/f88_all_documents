{% extends 'app_documents/base.html' %}  
{% block content %}
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { f88: '#16a34a', f88dark: '#0b6b2f' } } } }
</script>
<style>
  #mynavbar { display: none !important; }
  .footer { display: none !important; }
</style>

<div class="min-h-screen bg-gradient-to-b from-emerald-50 via-white to-white flex flex-col">
  <div class="py-10 text-center">
    <div class="flex justify-center">
      <a href="{% url 'home' %}"><img src="https://f88.vn/images/root/logo-f88-primary.svg" alt="F88" class="h-12"></a>
    </div>
    <h1 class="text-3xl font-bold text-f88dark tracking-wide mt-4 mb-2">HỆ THỐNG CHỨNG TỪ</h1>
    <p class="text-gray-600">Đặt lại mật khẩu</p>
  </div>

  <div class="max-w-xl w-full mx-auto px-4 pb-12">
    {% if form.errors %}
      <div class="mb-4 rounded-lg border border-red-200 bg-red-50 text-red-700 px-4 py-3 text-sm">
        {{ form.errors }}
      </div>
    {% endif %}

    <div class="bg-white shadow-xl shadow-emerald-100/60 border border-gray-100 rounded-2xl p-6">
      <h2 class="text-xl font-semibold text-gray-900 text-center mb-6">Nhập mật khẩu mới</h2>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label for="id_new_password1" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu mới</label>
          <div class="relative">
            <input type="password" id="id_new_password1" name="new_password1" required
                   class="w-full rounded-lg border border-gray-200 px-3 py-2 pr-10 focus:ring-2 focus:ring-f88 focus:border-f88 outline-none"
                   placeholder="Nhập mật khẩu mới">
            <button type="button" onclick="togglePasswordVisibility('id_new_password1')" class="absolute inset-y-0 right-0 px-3 text-gray-500 hover:text-f88dark">👁️</button>
          </div>
        </div>
        <div>
          <label for="id_new_password2" class="block text-sm font-medium text-gray-700 mb-1">Xác nhận mật khẩu</label>
          <div class="relative">
            <input type="password" id="id_new_password2" name="new_password2" required
                   class="w-full rounded-lg border border-gray-200 px-3 py-2 pr-10 focus:ring-2 focus:ring-f88 focus:border-f88 outline-none"
                   placeholder="Nhập lại mật khẩu mới">
          </div>
        </div>
        <button type="submit"
                class="w-full bg-f88 hover:bg-f88dark text-white font-semibold py-2.5 rounded-lg shadow-sm transition">
          Thay đổi
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  function togglePasswordVisibility(inputId) {
    var passwordInput = document.getElementById(inputId);
    var type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
    passwordInput.setAttribute("type", type);
  }
</script>
{% endblock %}
