{% extends 'app_documents/base.html' %}  
{% block content %}
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { f88: '#16a34a', f88dark: '#0b6b2f' } } }
  }
</script>
<style>
  #mynavbar { display: none !important; }
  .footer { display: none !important; }
</style>

<div class="min-h-screen bg-gradient-to-b from-emerald-50 via-white to-white flex flex-col">
  <div class="py-10 text-center">
    <div class="flex justify-center">
      <a href="{% url 'home' %}"><img src="https://f88.vn/images/root/logo-f88-primary.svg" alt="F88" class="h-12"></a>
    </div>
    <h1 class="text-3xl font-bold text-f88dark tracking-wide mt-4 mb-2">HỆ THỐNG CHỨNG TỪ</h1>
    <p class="text-gray-600">Quên mật khẩu</p>
  </div>
  <div class="flex-1 flex items-center justify-center px-4 pb-12">
    <div class="bg-white shadow-xl shadow-emerald-100/60 border border-gray-100 rounded-2xl p-8 max-w-lg w-full text-center">
      <h3 class="text-xl font-semibold text-gray-900 mb-3">Yêu cầu đã được gửi</h3>
      <p class="text-gray-600">Vui lòng kiểm tra GAPO để nhận liên kết đặt lại mật khẩu.</p>
      <div class="mt-5 flex flex-col sm:flex-row sm:justify-center gap-3">
        <a href="{% url 'login' %}" class="inline-flex justify-center items-center rounded-lg bg-f88 hover:bg-f88dark text-white font-semibold px-4 py-2.5 transition">Quay lại đăng nhập</a>
        <a href="{% url 'home' %}" class="inline-flex justify-center items-center rounded-lg border border-gray-200 text-gray-700 hover:border-f88 hover:text-f88 font-semibold px-4 py-2.5 transition">Về trang chủ</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
