<div class="rounded-2xl border border-gray-200 bg-white px-4 py-2 text-[10px] flex flex-wrap items-center gap-3">
  <a href="{% url 'workshift_register' %}" class="px-3 py-1.5 rounded-lg {% if request.resolver_match.url_name == 'workshift_register' %}bg-emerald-50 text-emerald-700 font-semibold{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
    Đăng ký ca làm việc
  </a>
  {% with current_tab=request.GET.tab|default:'' %}
  <a href="{% url 'workshift_tasks' %}?tab=assign" class="px-3 py-1.5 rounded-lg {% if request.resolver_match.url_name == 'workshift_tasks' and current_tab != 'catalog' %}bg-emerald-50 text-emerald-700 font-semibold{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
    Phân công công việc
  </a>
  {% if is_admin or is_super_admin %}
  <a href="{% url 'workshift_tasks' %}?tab=catalog" class="px-3 py-1.5 rounded-lg {% if request.resolver_match.url_name == 'workshift_tasks' and current_tab == 'catalog' %}bg-emerald-50 text-emerald-700 font-semibold{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
    Danh mục công việc
  </a>
  {% endif %}
  {% endwith %}
  {% if is_admin or is_super_admin %}
  <a href="{% url 'workshift_policy' %}" class="px-3 py-1.5 rounded-lg {% if request.resolver_match.url_name == 'workshift_policy' %}bg-emerald-50 text-emerald-700 font-semibold{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
    Cấu hình ca làm việc
  </a>
  {% endif %}
</div>
