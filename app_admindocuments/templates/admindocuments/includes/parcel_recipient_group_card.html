<div data-recipient-group="{{ group.key }}" class="parcel-panel block w-full overflow-hidden rounded-[28px] border border-white/70 p-4 transition hover:-translate-y-0.5 hover:shadow-[0_22px_42px_rgba(15,23,42,0.1)]">
  <button type="button"
          @click="toggleRecipient('{{ group.key }}')"
          class="group block w-full text-left">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-2">
          <div class="text-[12px] font-bold leading-5 text-slate-900">{{ group.recipient_label }}</div>
          {% if group.has_unassigned %}
          <span class="inline-flex items-center gap-1 rounded-full border border-amber-200 bg-amber-50 px-2 py-0.5 text-[8px] font-semibold text-amber-700">
            <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>
            Chưa xác định
          </span>
          {% endif %}
        </div>
        <div class="mt-2 flex flex-wrap items-center gap-2">
          <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-2 py-0.5 text-[8px] font-semibold text-slate-600">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
            {{ group.count }} kiện chưa nhận
          </span>
        </div>
      </div>
      <svg xmlns="http://www.w3.org/2000/svg" class="mt-0.5 h-5 w-5 shrink-0 text-slate-300 transition duration-200 group-hover:text-slate-500" :class="openRecipientKey === '{{ group.key }}' ? 'rotate-90 text-slate-500' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m9 6 6 6-6 6"/>
      </svg>
    </div>
  </button>

  <div x-cloak x-show="openRecipientKey === '{{ group.key }}'" x-transition.opacity.duration.150ms class="mt-4 space-y-3 border-t border-slate-200/80 pt-4">
    <div class="grid grid-cols-2 gap-2 sm:flex sm:flex-wrap sm:items-center">
      <button type="button"
              @click.stop="toggleRecipientSelection({{ group.parcel_ids }})"
              class="rounded-full border border-slate-200 bg-white px-3 py-1.5 text-[10px] font-semibold text-slate-600">
        <span x-show="selectedCountFor({{ group.parcel_ids }}) < {{ group.count }}">Chọn tất cả</span>
        <span x-show="selectedCountFor({{ group.parcel_ids }}) === {{ group.count }}">Bỏ chọn</span>
      </button>
      <div class="rounded-full border border-emerald-100 bg-emerald-50 px-3 py-1.5 text-[10px] font-semibold text-emerald-700"
           x-text="selectedCountFor({{ group.parcel_ids }}) + '/{{ group.count }} đã chọn'"></div>
      <form method="post"
            action="{% url 'admindocuments:parcel_receipt_send_group_notification' %}"
            @click.stop
            @submit="startSubmittingAction('{{ group.key }}', 'notify')"
            class="col-span-2 sm:col-span-1">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <input type="hidden" name="selected_parcels" :value="selectedIdsFor({{ group.parcel_ids }}, {{ group.notifiable_parcel_ids }})">
        <button type="submit"
                class="w-full rounded-full bg-slate-900 px-3 py-1.5 text-[10px] font-semibold text-white disabled:cursor-not-allowed disabled:opacity-40 sm:w-auto"
                :disabled="selectedCountFor({{ group.parcel_ids }}, {{ group.notifiable_parcel_ids }}) === 0 || isSubmittingAction('{{ group.key }}', 'notify')">
          <span x-show="!isSubmittingAction('{{ group.key }}', 'notify')">
            {% if group.notification_send_count %}Gửi lại thông báo{% else %}Gửi thông báo{% endif %}
          </span>
          <span x-cloak x-show="isSubmittingAction('{{ group.key }}', 'notify')">Đang gửi...</span>
        </button>
      </form>
      {% if group.latest_confirm_url and group.latest_confirm_qr_svg_url %}
      <button type="button"
              @click.stop="openQrModal('{{ group.latest_confirm_url|escapejs }}', '{{ group.latest_confirm_qr_svg_url|escapejs }}', '{{ group.recipient_label|escapejs }}')"
              class="col-span-2 rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-[10px] font-semibold text-emerald-700 sm:col-span-1">
        QR xác nhận
      </button>
      {% endif %}
    </div>
    {% for doc in group.parcels %}
    {% include "admindocuments/includes/parcel_receipt_list_item.html" with doc=doc grouping_mode=grouping_mode %}
    {% endfor %}
  </div>
</div>
