<div class="cdt-picker" data-campaign-datetime>
  <div class="cdt-source" data-datetime-source>
    {% if field %}{{ field }}{% else %}<input type="datetime-local" name="{{ name }}" value="{{ value|default:'' }}" required>{% endif %}
  </div>
  <div class="cdt-fields">
    <label class="cdt-field">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
      <span><small>Ngày</small><input type="text" data-datetime-date autocomplete="off" aria-label="Chọn ngày"></span>
    </label>
    <label class="cdt-field">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span><small>Giờ</small><select data-datetime-time aria-label="Chọn giờ"></select></span>
    </label>
  </div>
</div>
