<div class="is-wide crm-rich-email-field" data-rich-email-field>
  <span>{{ label }}</span>
  <span class="crm-rich-email-toolbar" role="toolbar" aria-label="Định dạng nội dung email">
    <button type="button" data-rich-command="bold" title="In đậm"><strong>B</strong></button>
    <button type="button" data-rich-command="italic" title="In nghiêng"><em>I</em></button>
    <button type="button" data-rich-command="underline" title="Gạch chân"><u>U</u></button>
    <button type="button" data-rich-command="insertUnorderedList" title="Danh sách dấu đầu dòng">• Danh sách</button>
    <button type="button" data-rich-command="insertOrderedList" title="Danh sách đánh số">1. Danh sách</button>
    <button type="button" data-rich-command="createLink" title="Chèn liên kết">Liên kết</button>
    <button type="button" data-rich-command="removeFormat" title="Xóa định dạng">Xóa định dạng</button>
  </span>
  <span class="crm-rich-email-editor" contenteditable="true" role="textbox" aria-multiline="true" data-rich-email-editor></span>
  <span class="crm-rich-email-source">{{ field }}</span>
</div>
