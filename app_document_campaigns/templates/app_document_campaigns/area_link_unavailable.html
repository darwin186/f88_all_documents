<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ reason }} · F88</title>
  <link rel="icon" type="image/svg+xml" href="https://f88.vn/images/root/logo-f88-primary.svg">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f4f6f5;color:#17231d;font-family:"Segoe UI",Arial,sans-serif}
    .topbar{height:5px;background:#26362c}
    .nav{display:flex;height:72px;align-items:center;border-bottom:1px solid #dfe6e2;background:#fff;padding:0 32px}
    .nav img{display:block;width:92px;height:auto}
    main{display:grid;min-height:calc(100vh - 77px);place-items:center;padding:32px 18px}
    .card{width:min(520px,100%);border:1px solid #dce5e0;border-radius:18px;background:#fff;padding:42px 38px;text-align:center;box-shadow:0 18px 50px rgba(22,45,32,.08)}
    .icon{display:grid;width:68px;height:68px;margin:0 auto 22px;place-items:center;border:1px solid #f0d7aa;border-radius:20px;background:#fff8eb;color:#9a6812}
    .icon svg{width:30px;height:30px}
    .eyebrow{margin:0 0 8px;color:#00844a;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    h1{margin:0;color:#18251e;font-size:25px;line-height:1.3}
    .description{max-width:390px;margin:14px auto 0;color:#68766f;font-size:14px;line-height:1.65}
    .notice{display:flex;align-items:flex-start;gap:10px;margin-top:26px;border-radius:11px;background:#f3f8f5;padding:13px 15px;color:#486055;font-size:12px;line-height:1.55;text-align:left}
    .notice span{display:grid;width:20px;height:20px;flex:none;place-items:center;border-radius:50%;background:#dff1e7;color:#007a43;font-weight:800}
    @media(max-width:560px){.nav{height:62px;padding:0 20px}.nav img{width:78px}main{min-height:calc(100vh - 67px);padding:20px 12px}.card{padding:34px 22px}h1{font-size:21px}}
  </style>
</head>
<body>
  <div class="topbar"></div>
  <header class="nav"><img src="https://f88.vn/images/root/logo-f88-primary.svg" alt="F88"></header>
  <main>
    <section class="card" role="alert" aria-live="polite">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="10" width="14" height="10" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          <path d="M12 14v2"></path>
        </svg>
      </div>
      <p class="eyebrow">{{ eyebrow|default:"Xác nhận Quản lý khu vực" }}</p>
      <h1>{{ reason }}</h1>
      <p class="description">{{ description|default:"Liên kết này không thể tiếp tục sử dụng để xem hoặc xác nhận dữ liệu lỗi chứng từ." }}</p>
      <div class="notice"><span>i</span><div>Vui lòng liên hệ Phòng Vận Hành để kiểm tra thời hạn hoặc yêu cầu cấp lại liên kết mới.</div></div>
    </section>
  </main>
</body>
</html>
